---
# Results page deploy to GitHub Pages (https://qte77.github.io/feelings/).
#
# Pages source = "GitHub Actions" (Settings -> Pages -> Source). site/ is plain HTML,
# with no build step, deployed via actions/upload-pages-artifact + actions/deploy-pages.
# No gh-pages branch. Pattern and pins copied from qte77/analyze-stock-kpi's gh-pages.yaml.
#
# site/data/results.json is committed: the eval runs need a TypeSafe key and a Claude login,
# which CI doesn't have. Regenerate it locally with `eval/metrics.py --export` after a run.

name: gh-pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/gh-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy site/ to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
